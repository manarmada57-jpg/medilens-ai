services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medilens_backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - medilens_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongodb:
    image: mongo:7.0
    container_name: medilens_mongodb
    restart: unless-stopped
    env_file: .env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-medilens}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=medilens_db
    volumes:
      - mongodb_data:/data/db
    # Port NOT exposed to host — only accessible within the Docker network
    networks:
      - medilens_network
    healthcheck:
      test:
        - "CMD"
        - "mongosh"
        - "--username"
        - "${MONGO_ROOT_USER:-medilens}"
        - "--password"
        - "${MONGO_ROOT_PASSWORD}"
        - "--authenticationDatabase"
        - "admin"
        - "--eval"
        - "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  medilens_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
