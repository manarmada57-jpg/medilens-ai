services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medilens_web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - medilens_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medilens_api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medilens_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongodb:
    image: mongo:7.0
    container_name: medilens_mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-medilens_admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-change_this_secure_mongo_password_in_prod}
      - MONGO_INITDB_DATABASE=medilens_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - medilens_network
    healthcheck:
      test:
        - "CMD"
        - "mongosh"
        - "--username"
        - "${MONGO_ROOT_USER:-medilens_admin}"
        - "--password"
        - "${MONGO_ROOT_PASSWORD:-change_this_secure_mongo_password_in_prod}"
        - "--authenticationDatabase"
        - "admin"
        - "--eval"
        - "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7.2-alpine
    container_name: medilens_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - medilens_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  medilens_network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
