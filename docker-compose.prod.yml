services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medilens_web_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - medilens_network_prod
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medilens_api_prod
    restart: always
    env_file: .env.production
    expose:
      - "8000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medilens_network_prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  mongodb:
    image: mongo:7.0
    container_name: medilens_mongodb_prod
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=medilens_db
    volumes:
      - mongodb_data_prod:/data/db
    networks:
      - medilens_network_prod
    healthcheck:
      test:
        - "CMD"
        - "mongosh"
        - "--username"
        - "${MONGO_ROOT_USER}"
        - "--password"
        - "${MONGO_ROOT_PASSWORD}"
        - "--authenticationDatabase"
        - "admin"
        - "--eval"
        - "db.adminCommand('ping')"
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  redis:
    image: redis:7.2-alpine
    container_name: medilens_redis_prod
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data_prod:/data
    networks:
      - medilens_network_prod
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  medilens_network_prod:
    driver: bridge

volumes:
  mongodb_data_prod:
  redis_data_prod:
