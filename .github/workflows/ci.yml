name: MediLens CI

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-and-test:
    name: Backend Lint, Type Check & Real-MongoDB Test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: test_user
          MONGO_INITDB_ROOT_PASSWORD: test_password
          MONGO_INITDB_DATABASE: medilens_test
        options: >-
          --health-cmd "mongosh --username test_user --password test_password --authenticationDatabase admin --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies (OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin libmagic1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Ruff Linter
        run: |
          ruff check backend/app backend/tests

      - name: MyPy Type Check
        run: |
          mypy backend/app

      - name: Run Pytest against Real MongoDB
        env:
          SECRET_KEY: test_secret_key_minimum_64_characters_for_pytest_environment_only_1234
          FIELD_ENCRYPTION_KEYS: dGVzdF9mZXJuZXRfa2V5XzMyX2J5dGVzX2xvbmdfMTIzNDU2Nzg=
          MONGODB_URI: mongodb://test_user:test_password@localhost:27017/?authSource=admin
          MONGODB_DB_NAME: medilens_test
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: testing
        run: |
          cd backend && pytest --maxfail=5 -v

  frontend-lint-and-build:
    name: Frontend Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies (Clean)
        working-directory: frontend
        run: |
          npm ci

      - name: TypeScript Static Check
        working-directory: frontend
        run: |
          npm run lint

      - name: Static Data Audit
        working-directory: frontend
        run: |
          npm run check:static

      - name: Build React PWA
        working-directory: frontend
        run: |
          npm run build

  security-audit:
    name: Secret & Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Accidentally Committed Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Set up Python for pip-audit
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r backend/requirements.txt

      - name: Set up Node for npm audit
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run npm audit
        working-directory: frontend
        run: |
          npm audit --audit-level=high
